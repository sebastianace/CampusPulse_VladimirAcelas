# Campus Pulse completo: la base de datos (PostgreSQL con pgvector) y la aplicación.
#   docker compose up -d --build     levanta todo; la app queda en http://localhost:3000
#   docker compose up -d db          solo la base, para trabajar con `npm run dev`
# La contraseña de la base sale de POSTGRES_PASSWORD en .env. No corras a la vez la app de aquí y
# `npm run dev` en el mismo puerto.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env (ver .env.example)}
      POSTGRES_DB: campus_pulse
    ports:
      # Solo accesible desde este computador. 5433 y no 5432 para no chocar con un PostgreSQL local.
      - "127.0.0.1:${POSTGRES_PUERTO:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus_pulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # El .env aporta GEMINI_API_KEY y GEMINI_MODEL (es opcional: sin ellas la IA usa el formulario manual).
    env_file:
      - path: .env
        required: false
    # Lo que va aquí manda sobre el .env: dentro de la red de Docker la base es el servicio "db" en su puerto 5432.
    environment:
      POSTGRES_HOST: db
      POSTGRES_PUERTO: "5432"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env (ver .env.example)}
      PORT: "3000"
      # Vacío a propósito: con NODE_ENV=production la cookie de sesión es "secure" y no viaja por
      # http://localhost. Ponlo en production cuando la app se sirva por HTTPS.
      NODE_ENV: ${NODE_ENV:-}
      # Dentro de la red de Docker, pulse-ai es el servicio "pulse-ai".
      PULSE_AI_URL: http://pulse-ai:8000
      PULSE_AI_TOKEN: ${PULSE_AI_TOKEN:-}
      # Webhook firmado hacia n8n al crear una incidencia. Sin N8N_SECRETO la integración queda apagada.
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/incidencia-nueva
      N8N_SECRETO: ${N8N_SECRETO:-}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"

  # Servicio de RAG (Python + LangChain): responde preguntas sobre el campus citando documentos de knowledge/.
  # Si se cae, la app sigue funcionando (solo falla la pestaña de preguntas). Ver docs/rag.md.
  pulse-ai:
    build: ./pulse-ai
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_PUERTO: "5432"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env (ver .env.example)}
      CONOCIMIENTO_DIR: /srv/knowledge
      # Reranking apagado por defecto (ahorra una llamada y ~1.4 s por pregunta; ver docs/evaluacion-rag.md). 1 = encendido.
      RAG_RERANKING: ${RAG_RERANKING:-0}
      # Opcional: si lo defines, Express y pulse-ai se autentican con este secreto compartido.
      PULSE_AI_TOKEN: ${PULSE_AI_TOKEN:-}
    volumes:
      # Los documentos se montan (solo lectura): editar un .md y volver a ingestar no exige reconstruir la imagen.
      - ./knowledge:/srv/knowledge:ro
    ports:
      - "127.0.0.1:${PULSE_AI_PUERTO:-8000}:8000"

  # Automatización con n8n (edición Community, autoalojada): avisa de las incidencias, resume el día con IA, ingiere
  # documentos y tiene un agente para el personal de coordinación. Ver docs/workflows.md.
  #   docker compose up -d n8n mailpit  y luego  npm run n8n:preparar  (importa credenciales y flujos)
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.47.4
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      # Secreto compartido con Campus Pulse: firma del webhook y autenticación de /api/integraciones.
      N8N_SECRETO: ${N8N_SECRETO:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      CAMPUS_URL: http://app:3000
      GENERIC_TIMEZONE: America/Bogota
      TZ: America/Bogota
      # Los flujos leen N8N_SECRETO y GEMINI_MODEL con $env y verifican la firma con el módulo crypto de Node.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      WEBHOOK_URL: http://localhost:5678/
    ports:
      - "127.0.0.1:${N8N_PUERTO:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      # Los flujos exportados (JSON) se montan en solo lectura para importarlos.
      - ./n8n:/workflows:ro

  # Buzón de correo local y gratuito: n8n envía aquí los avisos (SMTP) y se leen en http://localhost:8025.
  # No sale ningún correo a Internet.
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:${MAILPIT_PUERTO:-8025}:8025"

volumes:
  pgdata:
  n8n_data:
